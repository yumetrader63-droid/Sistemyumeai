<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Generate Signals</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090c0f; --bg-card: #14181f; --bg-input: #1d232c;
      --accent-green: #00e676; --red-trade: #ff5252; --text-main: #ffffff;
      --border-dark: #232933;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-canvas); color: var(--text-main); padding: 20px; }
    
    .container { max-width: 600px; margin: 0 auto; background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-dark); }
    h2 { margin-bottom: 20px; color: var(--accent-green); text-align: center; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: #848e9c; font-weight: 600; }
    select, input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-dark); color: #fff; border-radius: 8px; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .btn-green { background: var(--accent-green); color: #000; }
    
    .preview-box { margin-top: 20px; background: var(--bg-input); padding: 15px; border-radius: 8px; max-height: 250px; overflow-y: auto; font-size: 0.85rem; }
    .item-up { color: var(--accent-green); font-weight: bold; }
    .item-down { color: var(--red-trade); font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>PANEL ADMIN - GENERATE SIGNAL ACAK</h2>
    
    <div class="form-group">
      <label>PILIH PAIR</label>
      <select id="admin-pair">
        <option value="BTC/USDT">BTC/USDT</option>
        <option value="ETH/USDT">ETH/USDT</option>
        <option value="SOL/USDT">SOL/USDT</option>
        <option value="EUR/USD">EUR/USD</option>
      </select>
    </div>

    <div class="form-group">
      <label>PILIH TIMEFRAME</label>
      <select id="admin-tf">
        <option value="15s">15 Detik</option>
        <option value="1m" selected>1 Menit</option>
        <option value="5m">5 Menit</option>
      </select>
    </div>

    <button id="btn-generate" class="btn btn-green">GENERATE & SIMPAN KE DATABASE</button>

    <div class="preview-box" id="preview-box">
      <em>List sinyal acak akan muncul di sini setelah di-generate...</em>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const btnGenerate = document.getElementById("btn-generate");
    const previewBox = document.getElementById("preview-box");

    btnGenerate.addEventListener("click", async () => {
      btnGenerate.innerText = "MENYIMPAN...";
      
      const pair = document.getElementById("admin-pair").value;
      const tf = document.getElementById("admin-tf").value;
      
      // Menentukan interval waktu berdasarkan timeframe
      let intervalMs = 60000; // default 1 menit
      if (tf === "15s") intervalMs = 15000;
      if (tf === "5m") intervalMs = 300000;

      const schedule = [];
      const now = new Date();
      let previewHTML = `<h4>Jadwal Tersimpan (${pair} - ${tf}):</h4><br>`;

      // Membuat 20 sinyal ke depan secara acak
      for (let i = 1; i <= 20; i++) {
        const signalTime = new Date(now.getTime() + (i * intervalMs));
        const h = String(signalTime.getHours()).padStart(2, '0');
        const m = String(signalTime.getMinutes()).padStart(2, '0');
        const s = String(signalTime.getSeconds()).padStart(2, '0');
        
        // Format waktu: jika 15 detik pakai detik (HH:MM:SS), jika menit pakai (HH:MM)
        const timeString = tf === "15s" ? `${h}:${m}:${s}` : `${h}:${m}`;
        
        // --- LOGIKA ACAK (RANDOM) ---
        // Math.random() menghasilkan angka antara 0.0 sampai 1.0
        // Jika angka di atas 0.5 = UP, jika di bawah 0.5 = DOWN
        const randomDirection = Math.random() > 0.5 ? "UP" : "DOWN";

        schedule.push({
          time: timeString,
          direction: randomDirection
        });

        const colorClass = randomDirection === "UP" ? "item-up" : "item-down";
        const arrow = randomDirection === "UP" ? "▲ BUY" : "▼ SELL";
        previewHTML += `<div style="margin-bottom: 5px;">[${timeString}] - <span class="${colorClass}">${arrow}</span></div>`;
      }

      try {
        // Menyimpan data ke Firestore (Membuat/Menimpa dokumen master sinyal)
        const docId = `${pair.replace('/','-')}_${tf}`; // Contoh ID: BTC-USDT_1m
        await setDoc(doc(db, "admin_master_signals", docId), {
          pair: pair,
          timeframe: tf,
          schedule: schedule,
          updatedAt: new Date().toISOString()
        });

        previewBox.innerHTML = previewHTML;
        alert("Sinyal acak berhasil di-generate dan disimpan ke database!");

      } catch (error) {
        console.error(error);
        alert("Gagal menyimpan sinyal. Cek console log / Rules Firestore Anda.");
      } finally {
        btnGenerate.innerText = "GENERATE & SIMPAN KE DATABASE";
      }
    });
  </script>
</body>
</html>
