
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yume Trading - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b08; --card-bg: rgba(12, 24, 18, 0.85); --card-border: rgba(16, 185, 129, 0.25);
      --accent-neon: #00ff87; --text-main: #f0fdf4; --text-muted: #9ca3af; --red-accent: #ff4d4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 16px; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight:700; margin-bottom:4px; }
    .form-control { width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size:0.85rem; }
    .btn-submit { width: 100%; padding: 10px; background: var(--accent-neon); border: none; border-radius: 8px; font-weight:800; color: #022c22; cursor: pointer; margin-top: 10px; }
    .btn-logout { background: rgba(255, 77, 77, 0.15); border: 1px solid var(--red-accent); color: var(--red-accent); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h3 style="color: var(--accent-neon);">⚡ ADMIN PANEL</h3>
    <button id="btn-logout" class="btn-logout">LOGOUT</button>
  </div>

  <div class="card">
    <form id="signal-form">
      <div class="form-group">
        <label>PAIR TRADING</label>
        <input type="text" id="pair" placeholder="BTC/USDT" class="form-control" required>
      </div>
      <div class="form-group">
        <label>TIPE POSISI</label>
        <select id="type" class="form-control">
          <option>BUY / LONG</option>
          <option>SELL / SHORT</option>
        </select>
      </div>
      <div class="form-group">
        <label>ENTRY AREA</label>
        <input type="text" id="entry" placeholder="65,000 - 65,200" class="form-control" required>
      </div>
      <div class="form-group">
        <label>TARGET TP</label>
        <input type="text" id="tp" placeholder="67,000" class="form-control" required>
      </div>
      <div class="form-group">
        <label>STOP LOSS</label>
        <input type="text" id="sl" placeholder="64,000" class="form-control" required>
      </div>
      <div class="form-group">
        <label>LEVERAGE</label>
        <input type="text" id="leverage" placeholder="10x - 20x" class="form-control" required>
      </div>
      <button type="submit" id="btn-send" class="btn-submit">KIRIM SINYAL</button>
    </form>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ Ganti dengan email akun admin Anda
    const ADMIN_EMAIL = "yumetrader63@gmail.com"; 

    // PROTEKSI: Cek apakah user login adalah Admin
    onAuthStateChanged(auth, (user) => {
      if (!user || user.email !== ADMIN_EMAIL) {
        alert("Akses Ditolak! Khusus Admin.");
        window.location.href = "index.html";
      }
    });

    // Tambah Data Sinyal ke Firestore Database
    document.getElementById("signal-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-send");
      btn.innerText = "MENGIRIM...";
      btn.disabled = true;

      try {
        await addDoc(collection(db, "signals"), {
          pair: document.getElementById("pair").value,
          type: document.getElementById("type").value,
          entry: document.getElementById("entry").value,
          tp: document.getElementById("tp").value,
          sl: document.getElementById("sl").value,
          leverage: document.getElementById("leverage").value,
          createdAt: serverTimestamp()
        });
        alert("Sinyal berhasil dikirim!");
        document.getElementById("signal-form").reset();
      } catch (err) {
        alert("Gagal mengirim sinyal: " + err.message);
      } finally {
        btn.innerText = "KIRIM SINYAL";
        btn.disabled = false;
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });
  </script>
</body>
</html>
