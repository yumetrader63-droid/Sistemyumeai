<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIP Signal Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-canvas: #090c0f;
      --bg-card: #14181f;
      --bg-input: #1d232c;
      --accent-green: #00e676;
      --red-trade: #ff5252;
      --border-dark: #232933;
      --text-main: #ffffff;
      --text-muted: #848e9c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-canvas); color: var(--text-main); min-height: 100vh; padding: 16px; }

    .header {
      max-width: 800px; margin: 0 auto 20px auto;
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-card); padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border-dark);
    }
    .user-info { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
    .user-email { color: var(--accent-green); display: block; font-size: 0.85rem; }

    .btn-logout {
      background: rgba(255, 82, 82, 0.15); color: var(--red-trade);
      border: 1px solid var(--red-trade); padding: 8px 14px; border-radius: 6px;
      font-weight: 800; font-size: 0.75rem; cursor: pointer;
    }

    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    .card { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: 14px; padding: 18px; }
    .card-title { font-size: 0.9rem; font-weight: 800; color: var(--text-muted); margin-bottom: 12px; }

    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .control-grid { grid-template-columns: 1fr; } }

    select {
      width: 100%; padding: 12px; background: var(--bg-input);
      border: 1px solid var(--border-dark); border-radius: 8px; color: var(--text-main); font-weight: 700; font-size: 0.85rem;
    }

    /* Tampilan Sinyal Aktif */
    .signal-box {
      text-align: center; padding: 24px; border-radius: 12px;
      background: var(--bg-input); border: 1px solid var(--border-dark); margin-top: 14px;
    }
    .clock-display { font-size: 1.8rem; font-weight: 800; color: var(--accent-green); letter-spacing: 1px; margin-bottom: 10px; }
    .signal-status { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    
    .direction-badge {
      display: inline-block; font-size: 2rem; font-weight: 800; padding: 10px 24px;
      border-radius: 8px; margin-top: 10px; width: 100%; max-width: 250px;
    }
    .badge-up { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-down { background: rgba(255, 82, 82, 0.15); color: var(--red-trade); border: 1px solid var(--red-trade); }
    .badge-wait { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-dark); font-size: 1.2rem; }

    /* Tabel Jadwal Sinyal */
    .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 10px; background: var(--bg-input); color: var(--text-muted); font-size: 0.7rem; font-weight: 800; }
    td { padding: 10px; border-bottom: 1px solid var(--border-dark); font-weight: 700; }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-info">
      LOGGED IN AS:
      <span class="user-email" id="display-email">Memuat...</span>
    </div>
    <button class="btn-logout" id="btn-logout">LOGOUT</button>
  </div>

  <div class="container">
    
    <!-- DASHBOARD CONTROL -->
    <div class="card">
      <div class="card-title">PILIH PAIR & TIMEFRAME</div>
      <div class="control-grid">
        <div>
          <select id="user-pair">
            <option value="BTC/USDT">BTC/USDT</option>
            <option value="ETH/USDT">ETH/USDT</option>
            <option value="SOL/USDT">SOL/USDT</option>
            <option value="EUR/USD">EUR/USD</option>
            <option value="GBP/USD">GBP/USD</option>
          </select>
        </div>
        <div>
          <select id="user-tf">
            <option value="15s">Timeframe 15 Detik</option>
            <option value="1m" selected>Timeframe 1 Menit</option>
            <option value="5m">Timeframe 5 Menit</option>
          </select>
        </div>
      </div>

      <!-- DISPLAY SINYAL REALTIME -->
      <div class="signal-box">
        <div class="clock-display" id="live-clock">00:00:00</div>
        <div class="signal-status" id="signal-status-text">MENUNGGU JADWAL SINYAL...</div>
        <div id="signal-badge-container">
          <div class="direction-badge badge-wait">STANDBY</div>
        </div>
      </div>
    </div>

    <!-- JADWAL SINYAL MENDATANG -->
    <div class="card">
      <div class="card-title">JADWAL SINYAL TERDEKAT</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>WAKTU EXECUTING</th>
              <th>ARAH TRADE</th>
              <th>STATUS</th>
            </tr>
          </thead>
          <tbody id="schedule-tbody">
            <tr><td colspan="3" style="color:var(--text-muted);">Memuat sinyal dari server...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const displayEmail = document.getElementById("display-email");
    const btnLogout = document.getElementById("btn-logout");
    const selectPair = document.getElementById("user-pair");
    const selectTf = document.getElementById("user-tf");
    const liveClock = document.getElementById("live-clock");
    const signalStatusText = document.getElementById("signal-status-text");
    const badgeContainer = document.getElementById("signal-badge-container");
    const scheduleTbody = document.getElementById("schedule-tbody");

    let activeSchedule = [];

    // 1. CEK AUTENTIKASI USER (Hanya User Login yang Boleh Masuk)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        displayEmail.innerText = user.email;
        loadSignals(); // Muat sinyal dari Firestore
      } else {
        // Jika belum login, tendang ke login.html
        window.location.href = "login.html";
      }
    });

    // Logout Functionality
    btnLogout.addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });

    // 2. BACA SINYAL MASTER DARI FIRESTORE SECARA REALTIME
    function loadSignals() {
      const pair = selectPair.value;
      const tf = selectTf.value;

      const q = query(
        collection(db, "admin_master_signals"),
        where("pair", "==", pair),
        where("timeframe", "==", tf)
      );

      onSnapshot(q, (snapshot) => {
        activeSchedule = [];
        if (snapshot.empty) {
          scheduleTbody.innerHTML = `<tr><td colspan="3" style="color:var(--text-muted);">Belum ada sinyal terbit untuk ${pair} (${tf}).</td></tr>`;
          return;
        }

        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          if (data.schedule && Array.isArray(data.schedule)) {
            activeSchedule = data.schedule;
          }
        });

        renderScheduleTable();
      });
    }

    // Event Listener saat User Mengubah Pair atau Timeframe
    selectPair.addEventListener("change", loadSignals);
    selectTf.addEventListener("change", loadSignals);

    // 3. JAM REALTIME & PENCERATAN SINYAL (Setiap Detik)
    setInterval(() => {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      
      const tf = selectTf.value;
      const timeNowStr = tf === "15s" ? `${h}:${m}:${s}` : `${h}:${m}`;

      liveClock.innerText = `${h}:${m}:${s}`;

      // Cari Sinyal yang Menit/Detiknya SAMA dengan Jam Sekarang
      const matchedSignal = activeSchedule.find(item => item.time === timeNowStr);

      if (matchedSignal) {
        signalStatusText.innerText = `SINYAL AKTIF (${matchedSignal.time})`;
        if (matchedSignal.direction === "UP") {
          badgeContainer.innerHTML = `<div class="direction-badge badge-up">▲ BUY / CALL</div>`;
        } else {
          badgeContainer.innerHTML = `<div class="direction-badge badge-down">▼ SELL / PUT</div>`;
        }
      } else {
        signalStatusText.innerText = "MENUNGGU JADWAL SINYAL...";
        badgeContainer.innerHTML = `<div class="direction-badge badge-wait">STANDBY</div>`;
      }

    }, 1000);

    // 4. RENDER TABEL JADWAL MENDATANG
    function renderScheduleTable() {
      if (activeSchedule.length === 0) return;

      scheduleTbody.innerHTML = "";
      
      // Tampilkan max 10 jadwal terdekat saja agar tidak memenuhi layar
      const displayItems = activeSchedule.slice(0, 15);

      displayItems.forEach(item => {
        const isUp = item.direction === "UP";
        const dirHtml = isUp 
          ? `<span style="color:var(--accent-green)">▲ BUY</span>` 
          : `<span style="color:var(--red-trade)">▼ SELL</span>`;

        scheduleTbody.innerHTML += `
          <tr>
            <td><b>${item.time}</b></td>
            <td>${dirHtml}</td>
            <td><span style="color:var(--text-muted); font-size:0.75rem;">READY</span></td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
