<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yume Algorit VIP - Trading Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Solid Dark Canvas & Clean Green Accent (Terpisah, Tanpa Gradasi Bg) */
      --bg-canvas: #0b0e11;        /* Dark background ala platform trading */
      --bg-card: #151a21;          /* Solid dark card */
      --bg-input: #1e242d;         /* Input & button background */
      
      --accent-green: #00e676;     /* Solid Green Trading Neon */
      --accent-green-hover: #00c853;
      --red-trade: #ff5252;        /* Solid Red Sell Signal */
      
      --border-dark: #262c36;      /* Garis batas tegas */
      --border-accent: #00e676;
      
      --text-main: #ffffff;
      --text-muted: #848e9c;
      --text-dim: #474d57;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .terminal-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Solid Header Component */
    .header-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent-green);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-input);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-dark);
    }

    .user-email {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .btn-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .btn-logout {
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.3);
      color: var(--red-trade);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Live Digital Clock Widget */
    .clock-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clock-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .clock-time {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-green);
      font-variant-numeric: tabular-nums;
      font-family: monospace;
    }

    /* Trading Control Panel Card */
    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    /* Custom Select Olymp Style */
    .select-pair {
      width: 100%;
      padding: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 700;
      outline: none;
    }

    .select-pair:focus {
      border-color: var(--accent-green);
    }

    /* Timeframe Selector Buttons */
    .tf-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .tf-btn {
      padding: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .tf-btn.active {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #000000;
    }

    /* Big Action Button (Olymp Trade Style) */
    .btn-execute {
      width: 100%;
      padding: 14px;
      background: var(--accent-green);
      border: none;
      border-radius: 8px;
      color: #000000;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s ease;
    }

    .btn-execute:hover {
      background: var(--accent-green-hover);
    }

    .btn-execute:disabled {
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    /* Signal Result Terminal Box */
    .signal-box {
      margin-top: 4px;
      display: none;
      background: var(--bg-input);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 14px;
    }

    .signal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-dark);
      margin-bottom: 10px;
    }

    .signal-pair {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .signal-type {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .type-buy {
      background: var(--accent-green);
      color: #000000;
    }

    .type-sell {
      background: var(--red-trade);
      color: #ffffff;
    }

    .signal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-item {
      background: var(--bg-card);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-dark);
    }

    .grid-item span {
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .grid-item b {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    
    <!-- Header Bar -->
    <div class="header-bar">
      <div class="brand-title">
        <div class="status-dot"></div>
        YUME ALGORIT
      </div>

      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="user-box">
          <span id="user-email-text" class="user-email">loading...</span>
          <button id="toggle-email" class="btn-icon" title="Toggle Email">
            <svg id="eye-email-icon" viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
        <button id="btn-logout" class="btn-logout">OUT</button>
      </div>
    </div>

    <!-- Live Server Time -->
    <div class="clock-card">
      <span class="clock-label">SERVER TIME</span>
      <span id="live-clock" class="clock-time">00:00:00</span>
    </div>

    <!-- Main Panel -->
    <div class="panel-card">
      
      <div class="panel-group">
        <label>ASSET / PAIR</label>
        <select id="pair-select" class="select-pair">
          <option value="BTC/USDT">BTC / USDT (Crypto)</option>
          <option value="ETH/USDT">ETH / USDT (Crypto)</option>
          <option value="SOL/USDT">SOL / USDT (Crypto)</option>
          <option value="EUR/USD">EUR / USD (Forex)</option>
          <option value="GBP/USD">GBP / USD (Forex)</option>
        </select>
      </div>

      <div class="panel-group">
        <label>EXPIRATION / TIMEFRAME</label>
        <div class="tf-selector">
          <button class="tf-btn active" data-tf="15s">15 DETIK</button>
          <button class="tf-btn" data-tf="1m">1 MENIT</button>
          <button class="tf-btn" data-tf="5m">5 MENIT</button>
        </div>
      </div>

      <button id="btn-generate" class="btn-execute">GENERATE SIGNAL</button>

      <!-- Terminal Output Result -->
      <div id="signal-box" class="signal-box">
        <div class="signal-header">
          <span id="res-pair" class="signal-pair">BTC/USDT</span>
          <span id="res-type" class="signal-type type-buy">BUY</span>
        </div>
        <div class="signal-grid">
          <div class="grid-item">
            <span>ENTRY AREA</span>
            <b id="res-entry">-</b>
          </div>
          <div class="grid-item">
            <span>TARGET TP</span>
            <b id="res-tp" style="color: var(--accent-green);">-</b>
          </div>
          <div class="grid-item">
            <span>STOP LOSS</span>
            <b id="res-sl" style="color: var(--red-trade);">-</b>
          </div>
          <div class="grid-item">
            <span>TIMEFRAME</span>
            <b id="res-tf">-</b>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let rawEmail = "";
    let isEmailHidden = false;
    let selectedTimeframe = "15s";

    // 1. Authenticated User Check
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        rawEmail = user.email;
        updateEmailDisplay();
      }
    });

    // 2. Hide / Show Email Logic
    const emailText = document.getElementById("user-email-text");
    const toggleEmailBtn = document.getElementById("toggle-email");

    function updateEmailDisplay() {
      if (isEmailHidden) {
        const parts = rawEmail.split("@");
        emailText.innerText = parts[0].substring(0, 2) + "***@" + parts[1];
      } else {
        emailText.innerText = rawEmail;
      }
    }

    toggleEmailBtn.addEventListener("click", () => {
      isEmailHidden = !isEmailHidden;
      updateEmailDisplay();
    });

    // 3. Realtime Server Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById("live-clock").innerText = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 4. Timeframe Selector
    const tfButtons = document.querySelectorAll(".tf-btn");
    tfButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        tfButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedTimeframe = btn.getAttribute("data-tf");
      });
    });

    // 5. Query Real-Time Signal
    const btnGenerate = document.getElementById("btn-generate");
    const signalBox = document.getElementById("signal-box");

    btnGenerate.addEventListener("click", async () => {
      const selectedPair = document.getElementById("pair-select").value;
      
      btnGenerate.innerText = "ANALYZING MARKET...";
      btnGenerate.disabled = true;

      try {
        const q = query(
          collection(db, "signals"),
          where("pair", "==", selectedPair),
          orderBy("createdAt", "desc"),
          limit(1)
        );

        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          const signalData = querySnapshot.docs[0].data();
          
          document.getElementById("res-pair").innerText = signalData.pair;
          
          const resType = document.getElementById("res-type");
          const isBuy = signalData.type.toUpperCase().includes("BUY");
          resType.innerText = isBuy ? "BUY / UP" : "SELL / DOWN";
          resType.className = `signal-type ${isBuy ? "type-buy" : "type-sell"}`;

          document.getElementById("res-entry").innerText = signalData.entry;
          document.getElementById("res-tp").innerText = signalData.tp;
          document.getElementById("res-sl").innerText = signalData.sl;
          document.getElementById("res-tf").innerText = selectedTimeframe.toUpperCase();

          signalBox.style.display = "block";
        } else {
          alert(`Sinyal untuk pair ${selectedPair} belum tersedia.`);
          signalBox.style.display = "none";
        }
      } catch (err) {
        alert("Gagal memuat sinyal: " + err.message);
      } finally {
        btnGenerate.innerText = "GENERATE SIGNAL";
        btnGenerate.disabled = false;
      }
    });

    // 6. Sign Out
    document.getElementById("btn-logout").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "index.html");
    });
  </script>
</body>
</html>
