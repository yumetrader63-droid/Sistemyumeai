<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yume Trading VIP - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b08; --card-bg: rgba(12, 24, 18, 0.85); --card-border: rgba(16, 185, 129, 0.25);
      --accent-neon: #00ff87; --text-main: #f0fdf4; --text-muted: #9ca3af; --red-accent: #ff4d4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; }
    .title { text-align: center; margin-bottom: 20px; }
    .title h2 { color: var(--accent-neon); font-size: 1.4rem; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; outline: none; }
    .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent-neon), #059669); border: none; border-radius: 10px; color: #022c22; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .alert-error { background: rgba(255, 77, 77, 0.15); border: 1px solid var(--red-accent); color: var(--red-accent); padding: 10px; border-radius: 8px; font-size: 0.8rem; text-align: center; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">
      <h2>YUME TRADING VIP</h2>
      <p style="font-size:0.8rem; color:var(--text-muted);">Masuk ke Dashboard Sistem</p>
    </div>
    <div id="error-msg" class="alert-error"></div>
    <form id="login-form">
      <div class="form-group">
        <label>EMAIL</label>
        <input type="email" id="email" class="form-control" required placeholder="user@domain.com">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" id="btn-login" class="btn-submit">LOGIN</button>
    </form>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Cek jika sudah login sebelumnya
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "dashboard.html";
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const btn = document.getElementById("btn-login");
      const err = document.getElementById("error-msg");

      err.style.display = "none";
      btn.innerText = "MEMPROSES...";
      btn.disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        btn.innerText = "LOGIN";
        btn.disabled = false;
        err.style.display = "block";
        err.innerText = "Email atau Password Salah!";
      }
    });
  </script>
</body>
</html>
