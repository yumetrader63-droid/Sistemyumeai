<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yume Algorit VIP - Login</title>
  <!-- Font Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Terpisah Antara Dark Canvas & Green Accent */
      --bg-dark-base: #040806;
      --bg-dark-surface: rgba(10, 20, 15, 0.92);
      
      --accent-green-main: #10b981;
      --accent-green-neon: #00ff87;
      --green-glow: rgba(0, 255, 135, 0.18);
      --border-green: rgba(16, 185, 129, 0.3);
      
      --text-main: #f0fdf4;
      --text-muted: #9ca3af;
      --red-accent: #ff4d4d;
      --telegram-blue: #0088cc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 135, 0.14) 0%, transparent 65%),
        radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    .card {
      background: var(--bg-dark-surface);
      border: 1px solid var(--border-green);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-green-neon), transparent);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 255, 135, 0.08);
      border: 1px solid rgba(0, 255, 135, 0.3);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--accent-green-neon);
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .title {
      text-align: center;
      margin-bottom: 24px;
    }

    .title h2 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, var(--accent-green-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .title p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Input Wrapper & Responsif Touch Target */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      padding: 14px 42px 14px 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-green);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: var(--accent-green-neon);
      box-shadow: 0 0 12px var(--green-glow);
    }

    /* Toggle Icon Eye */
    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 8px;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: var(--accent-green-neon);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-green-neon), #059669);
      border: none;
      border-radius: 12px;
      color: #022c22;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 0 16px var(--green-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0 16px 0;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .divider span {
      padding: 0 10px;
      letter-spacing: 0.5px;
    }

    /* Telegram Button */
    .btn-telegram {
      width: 100%;
      padding: 13px;
      background: rgba(0, 136, 204, 0.12);
      border: 1px solid rgba(0, 136, 204, 0.4);
      border-radius: 12px;
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-telegram:hover {
      background: rgba(0, 136, 204, 0.25);
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(0, 136, 204, 0.25);
    }

    .btn-telegram:active {
      transform: scale(0.98);
    }

    .btn-telegram svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .alert-error {
      background: rgba(255, 77, 77, 0.15);
      border: 1px solid var(--red-accent);
      color: var(--red-accent);
      padding: 11px;
      border-radius: 10px;
      font-size: 0.78rem;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }

    /* Media Query Responsif HP */
    @media (max-width: 480px) {
      .card {
        padding: 26px 18px;
        border-radius: 20px;
      }
      .title h2 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">
      <div class="brand-badge">SYSTEM ACCESS</div>
      <h2>YUME ALGORIT VIP</h2>
      <p>Masuk ke Portal Signal & Analytics</p>
    </div>

    <div id="error-msg" class="alert-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label>EMAIL AKUN</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="form-control" style="padding-right: 15px;" required placeholder="nama@domain.com" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
          <!-- Toggle Mata Icon -->
          <button type="button" id="toggle-pwd" class="toggle-password" aria-label="Lihat Password">
            <svg id="eye-icon" viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-login" class="btn-submit">LOGIN SEKARANG</button>
    </form>

    <div class="divider">
      <span>BELUM PUNYA AKUN?</span>
    </div>

    <!-- Telegram Button Update -->
    <a href="https://t.me/yumazoki" target="_blank" class="btn-telegram">
      <svg viewBox="0 0 24 24">
        <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.28c-.15.67-.54.83-1.1.52l-3.02-2.23-1.46 1.4c-.16.16-.3.3-.61.3l.21-3.08 5.61-5.07c.24-.22-.05-.34-.37-.13l-6.93 4.36-2.98-.93c-.65-.2-.66-.65.14-.96l11.66-4.5c.54-.2 1.01.13.82.84z"/>
      </svg>
      Daftar via Telegram (@yumazoki)
    </a>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 💡 MASUKKAN EMAIL ADMIN ANDA DI SINI
    const ADMIN_EMAIL = "yumetrader63@gmail.com";

    // Toggle Lihat Password
    const passwordInput = document.getElementById("password");
    const togglePwdBtn = document.getElementById("toggle-pwd");
    const eyeIcon = document.getElementById("eye-icon");

    togglePwdBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      
      if (isPassword) {
        eyeIcon.innerHTML = `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>`;
      } else {
        eyeIcon.innerHTML = `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
      }
    });

    // Redireksi otomatis jika pengguna sudah login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "dashboard.html";
        }
      }
    });

    // Form Login Submit
    const loginForm = document.getElementById("login-form");
    const errorMsg = document.getElementById("error-msg");
    const btnLogin = document.getElementById("btn-login");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      errorMsg.style.display = "none";
      btnLogin.innerText = "MEMERIKSA HAK AKSES...";
      btnLogin.disabled = true;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          window.location.href = "admin.html";
        } else {
          window.location.href = "dashboard.html";
        }
      } catch (error) {
        btnLogin.innerText = "LOGIN SEKARANG";
        btnLogin.disabled = false;
        errorMsg.style.display = "block";

        switch (error.code) {
          case 'auth/invalid-credential':
          case 'auth/user-not-found':
          case 'auth/wrong-password':
            errorMsg.innerText = "Email atau Password tidak valid!";
            break;
          case 'auth/too-many-requests':
            errorMsg.innerText = "Terlalu banyak percobaan. Silakan coba lagi nanti.";
            break;
          default:
            errorMsg.innerText = "Gagal masuk: " + error.message;
        }
      }
    });
  </script>
</body>
</html>
